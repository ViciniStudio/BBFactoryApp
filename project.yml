name: BBFactoryApp

options:
  bundleIdPrefix: fr.vicinistudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: fr
  xcodeVersion: "26.0"
  groupSortPosition: top

attributes:
  ORGANIZATIONNAME: Vicini Studio

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  BBFactoryApp:
    type: application
    platform: iOS
    sources:
      - path: BBFactoryApp
        excludes:
          - "**/.DS_Store"
          - "Resources/**"
      - path: BBFactoryApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BBFactoryApp
        PRODUCT_BUNDLE_IDENTIFIER: fr.vicinistudio.bbfactory
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "B&B Factory"
        INFOPLIST_KEY_CFBundleName: "BB Factory"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.food-and-drink"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 B&B Factory. Application développée par Vicini Studio."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - BBFactoryAppTests

  BBFactoryAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BBFactoryAppTests
      - path: BBFactoryApp/Resources/Config/Restaurant.json
        buildPhase: resources
    dependencies:
      - target: BBFactoryApp
    settings:
      base:
        PRODUCT_NAME: BBFactoryAppTests
        PRODUCT_BUNDLE_IDENTIFIER: fr.vicinistudio.bbfactory.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BBFactoryApp.app/BBFactoryApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
